<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Elite Design</title><meta name="description" content="Elite Design - Graphic Designer, Calligrapher, Artist and Typeface Designer">
<link rel="icon" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Hind+Siliguri:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#0a0344;--accent:#d93a00;--hot:#ff6a33;--wall:#f3f4fa;--text:#14123a;--muted:#5b5d86;--line:#dcdcee;
--head:'Bricolage Grotesque','Hind Siliguri',sans-serif;--body:'Hind Siliguri',system-ui,sans-serif}
*{box-sizing:border-box;margin:0}html{scroll-behavior:smooth;scroll-padding-top:84px}
body{background:var(--wall);color:var(--text);font:400 1.0625rem/1.65 var(--body)}
a{color:inherit}img{max-width:100%}
.wrap{width:min(1280px,100% - 8vw);margin-inline:auto}
header{position:sticky;top:0;z-index:10;background:var(--ink);color:#fff}
header .wrap{display:flex;align-items:center;justify-content:space-between;height:64px;gap:16px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;font:800 1.2rem var(--head)}
.brand img{width:38px;height:38px;border-radius:50%}
nav{display:flex;align-items:center;gap:28px}nav a{text-decoration:none;color:#c9cbe8;font-weight:500}nav a:hover{color:#fff}
.btn{display:inline-block;background:var(--accent);color:#fff;padding:10px 22px;border-radius:99px;text-decoration:none;font-weight:600;border:2px solid var(--accent);transition:background .2s,color .2s;text-align:center}
.btn:hover{background:#b82f00;border-color:#b82f00;color:#fff}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}.btn.ghost:hover{background:var(--ink);border-color:var(--ink);color:#fff}
nav .btn{padding:7px 20px;color:#fff}
.layout{display:grid;grid-template-columns:340px 1fr;gap:32px;align-items:start;padding-block:40px 72px}
.profile{position:sticky;top:88px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:32px 28px;text-align:center}
.profile .av{width:128px;height:128px;border-radius:50%;display:block;margin:0 auto 18px;border:1px solid var(--line)}
.profile h1{font:800 1.7rem/1.15 var(--head);color:var(--ink);letter-spacing:-.01em}
.profile .tag{color:var(--muted);margin-top:8px}
.pbtn{display:grid;gap:10px;margin-top:20px}
.stats{display:flex;justify-content:center;gap:36px;margin-top:24px;padding-top:22px;border-top:1px solid var(--line)}
.stats b{display:block;font:800 1.6rem/1 var(--head);color:var(--ink)}.stats span{color:var(--muted);font-size:.9rem}
.soc{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:22px}
.soc a{font-size:.9rem;padding:5px 14px;border:1px solid var(--line);border-radius:99px;text-decoration:none;color:var(--ink)}.soc a:hover{background:var(--ink);color:#fff;border-color:var(--ink)}
#about{text-align:left;margin-top:26px;padding-top:22px;border-top:1px solid var(--line)}
#about h2{font:800 1rem var(--head);color:var(--ink);margin-bottom:8px}
#about p{color:var(--muted);font-size:1rem}
.tabrow{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-bottom:22px}
.tabrow h2{font:800 1.05rem var(--head);color:var(--ink);padding:0 2px 12px;border-bottom:3px solid var(--ink);margin-bottom:-1px}
.count{color:var(--muted);padding-bottom:12px}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:24px}
.tabs button{font:500 .95rem var(--body);background:#fff;border:1px solid var(--line);color:var(--muted);padding:6px 16px;border-radius:99px;cursor:pointer;transition:border-color .2s,color .2s}
.tabs button:hover{border-color:var(--ink);color:var(--ink)}.tabs button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.tabs small{opacity:.7;margin-left:6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:24px 20px}
.card{cursor:zoom-in;border-radius:8px}
.thumb{aspect-ratio:4/3;background:#e6e7f3;border-radius:8px;overflow:hidden;border:1px solid var(--line)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .35s}
.card:hover .thumb{border-color:var(--ink)}.card:hover .thumb img{transform:scale(1.04)}
.card figcaption{display:flex;justify-content:space-between;gap:12px;padding:10px 2px 0}
.card b{font:600 1rem var(--head);color:var(--ink)}.card small{color:var(--muted);white-space:nowrap}
.empty{aspect-ratio:4/3;border:1.5px dashed #b9bad8;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--muted)}
#contact{background:var(--ink);color:#fff;text-align:center;padding:80px 0}
#contact h2{font:800 clamp(1.8rem,3.6vw,2.6rem)/1.1 var(--head);letter-spacing:-.02em;max-width:14em;margin:0 auto}
#contact p{color:#c9cbe8;margin:14px auto 0;max-width:30em}
.links{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:28px}
.links .btn.ghost{color:#fff;border-color:rgba(255,255,255,.4)}.links .btn.ghost:hover{background:#fff;color:var(--ink);border-color:#fff}
.links .note{color:#9ea0cc}
footer{background:#06022b;color:#9ea0cc;padding:22px 0;font-size:.92rem}
#lb{position:fixed;inset:0;background:rgba(6,2,36,.95);display:none;flex-direction:column;align-items:center;justify-content:center;z-index:30;padding:56px 64px 24px}
#lb.on{display:flex}
#lb img{max-width:100%;max-height:calc(100% - 64px);object-fit:contain;border-radius:4px}
#lb .cap{color:#fff;margin-top:14px;text-align:center}#lb .cap small{display:block;color:#a9abd0}
#lb button{position:absolute;background:rgba(255,255,255,.1);border:0;color:#fff;width:46px;height:46px;border-radius:50%;font-size:1.5rem;cursor:pointer}
#lb button:hover{background:rgba(255,255,255,.25)}
#lb .x{top:14px;right:16px}#lb .pv{left:14px;top:50%}#lb .nx{right:14px;top:50%}
:focus-visible{outline:3px solid var(--hot);outline-offset:3px}
@media(max-width:900px){.layout{grid-template-columns:1fr;padding-top:24px}.profile{position:static}}
@media(max-width:640px){nav a:not(.btn){display:none}.grid{grid-template-columns:1fr}#lb{padding:56px 12px 16px}#lb .pv,#lb .nx{top:auto;bottom:16px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
.layout{padding-top:28px}
.banner{margin-top:24px;height:clamp(120px,18vw,220px);border-radius:10px;overflow:hidden;border:1px solid var(--line);background:#e6e7f3}
.banner img{width:100%;height:100%;object-fit:cover;display:block}
.tags{margin-bottom:22px}.tags button{font-size:.85rem;padding:3px 12px}.tags button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.thumb{position:relative}.thumb .n{position:absolute;right:8px;top:8px;background:rgba(10,3,68,.82);color:#fff;border-radius:99px;font-size:.78rem;padding:1px 10px}
#pj{position:fixed;inset:0;z-index:40;background:var(--wall);overflow:auto}#pj[hidden]{display:none}
.pbar{position:sticky;top:0;z-index:2;background:rgba(243,244,250,.95);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;padding:10px max(4vw,16px)}
.pbar button{font:600 1rem var(--body);background:#fff;border:1px solid var(--line);border-radius:99px;color:var(--ink);padding:6px 18px;cursor:pointer;margin-left:6px}.pbar button:hover{background:var(--ink);color:#fff}
.pbody{width:min(960px,100% - 8vw);margin:0 auto;padding:36px 0 80px}
.pbody h2{font:800 clamp(1.8rem,4vw,2.8rem)/1.1 var(--head);color:var(--ink);letter-spacing:-.02em}
.pmeta{color:var(--muted);margin:8px 0 14px}.pdesc{white-space:pre-line;max-width:42em;margin-top:6px}
.share{display:flex;gap:8px;flex-wrap:wrap;margin:22px 0 28px}
.share a,.share button{font:500 .92rem var(--body);padding:6px 16px;border:1px solid var(--line);border-radius:99px;text-decoration:none;color:var(--ink);background:#fff;cursor:pointer}.share a:hover,.share button:hover{background:var(--ink);color:#fff;border-color:var(--ink)}
.pimgs img{width:100%;display:block;border-radius:6px;margin-bottom:20px;background:#e6e7f3}
</style></head><body>
<header><div class="wrap"><a class="brand" href="#top"><img id="logo" alt="" hidden><span id="nm">Elite Design</span></a>
<nav><a href="#work">Work</a><a href="#about">About me</a><a class="btn" href="#contact">Contact</a></nav></div></header>
<div class="wrap"><div class="banner" id="bn" hidden><img id="cv" alt=""></div></div>
<main id="top" class="wrap layout">
<aside class="profile">
<img class="av" id="av" alt="Logo" hidden><h1 id="h1">Elite Design</h1><p class="tag" id="tag"></p>
<div class="pbtn" id="pbtn"></div><div class="stats" id="stats" hidden></div><div class="soc" id="soc"></div>
<div id="about"><h2>About me</h2><p id="ab"></p></div>
</aside>
<section id="work"><div class="tabrow"><h2>My work</h2><span class="count" id="cnt"></span></div>
<div class="tabs" id="tabs"></div><div class="tabs tags" id="tags"></div><div class="grid" id="grid"></div></section>
</main>
<section id="contact"><div class="wrap"><h2>Let's work on your next project</h2><p>Logo, calligraphy, typeface or graphic design. Tell me what you need.</p><div class="links" id="links"></div></div></section>
<footer><div class="wrap">© <span id="yr"></span> <span id="ft">Elite Design</span>. All rights reserved.</div></footer>
<div id="pj" hidden role="dialog" aria-modal="true" aria-label="Project"><div class="pbar"><button class="pc">← Back</button><div><button class="pp" aria-label="Previous project">‹</button><button class="pn" aria-label="Next project">›</button></div></div><article class="pbody" id="pbody"></article></div>
<script>
const $=id=>document.getElementById(id);
let data={settings:{},designs:[]},D=[],cat="All",tag="",view=[],pushed=false,T0=document.title;
const esc=s=>String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm=d=>{const im=d.images&&d.images.length?d.images:d.image?[d.image]:[];return{...d,tags:d.tags||[],images:im,cover:d.cover||im[0]||""}};
function render(){
 const s=data.settings,name=s.name||"Elite Design";D=(data.designs||[]).map(norm).filter(d=>d.cover);T0=name;
 if($("pj").hidden)document.title=name;
 $("nm").textContent=$("h1").textContent=$("ft").textContent=name;
 $("tag").textContent=s.tagline||"";$("ab").textContent=s.about||"";$("yr").textContent=new Date().getFullYear();
 if(s.logo){$("logo").src=$("av").src=s.logo;$("logo").hidden=$("av").hidden=false}
 if(s.cover){$("cv").src=s.cover;$("bn").hidden=false}
 const wa=s.whatsapp?`https://wa.me/${esc(s.whatsapp.replace(/\D/g,''))}`:"",mail=s.email?`mailto:${esc(s.email)}`:"",fb=s.facebook?esc(s.facebook):"";
 $("pbtn").innerHTML='<a class="btn" href="#contact">Hire me</a>'+(wa?`<a class="btn ghost" href="${wa}" target="_blank" rel="noopener">Message on WhatsApp</a>`:mail?`<a class="btn ghost" href="${mail}">Send an email</a>`:"");
 $("soc").innerHTML=[wa&&`<a href="${wa}" target="_blank" rel="noopener">WhatsApp</a>`,mail&&`<a href="${mail}">Email</a>`,fb&&`<a href="${fb}" target="_blank" rel="noopener">Facebook</a>`].filter(Boolean).join("");
 $("links").innerHTML=[wa&&`<a class="btn" href="${wa}" target="_blank" rel="noopener">WhatsApp</a>`,mail&&`<a class="btn ghost" href="${mail}">Email</a>`,fb&&`<a class="btn ghost" href="${fb}" target="_blank" rel="noopener">Facebook</a>`].filter(Boolean).join("")||'<span class="note">Contact details coming soon.</span>';
 const cats=[...new Set(D.map(d=>d.category).filter(Boolean))],fq={};
 D.forEach(d=>d.tags.forEach(t=>fq[t]=(fq[t]||0)+1));
 const tg=Object.keys(fq).sort((a,b)=>fq[b]-fq[a]).slice(0,16);
 if(cat!=="All"&&!cats.includes(cat))cat="All";if(tag&&!fq[tag])tag="";
 $("stats").hidden=!D.length;$("stats").innerHTML=`<div><b>${D.length}</b><span>Projects</span></div>`+(cats.length?`<div><b>${cats.length}</b><span>Categories</span></div>`:"");
 $("tabs").innerHTML=cats.length>1?["All",...cats].map(c=>`<button class="${c===cat?'on':''}" data-c="${esc(c)}">${esc(c)}<small>${c==="All"?D.length:D.filter(d=>d.category===c).length}</small></button>`).join(""):"";
 $("tags").innerHTML=tg.map(t=>`<button class="${t===tag?'on':''}" data-t="${esc(t)}">#${esc(t)}</button>`).join("");
 view=D.filter(d=>(cat==="All"||d.category===cat)&&(!tag||d.tags.includes(tag)));
 $("cnt").textContent=D.length?view.length+(view.length===1?" project":" projects"):"";
 $("grid").innerHTML=view.length?view.map(d=>`<figure class="card" tabindex="0" role="button" data-id="${esc(d.id)}" aria-label="Open ${esc(d.title)}"><div class="thumb"><img loading="lazy" src="${esc(d.cover)}" alt="${esc(d.title)}">${d.images.length>1?`<span class="n">${d.images.length}</span>`:""}</div><figcaption><b>${esc(d.title)}</b><small>${esc(d.category)}</small></figcaption></figure>`).join(""):'<div class="empty">Projects coming soon</div>'.repeat(3);
}
function fill(p){
 const u=`${location.origin}/projects/${encodeURIComponent(p.id)}/`,dt=p.date&&!isNaN(new Date(p.date))?new Date(p.date).toLocaleDateString("en",{year:"numeric",month:"short",day:"numeric"}):"";
 $("pbody").innerHTML=`<h2>${esc(p.title)}</h2><div class="pmeta">${[p.category,dt].filter(Boolean).map(esc).join(" · ")}</div>`+
 (p.tags.length?`<div class="tabs tags">${p.tags.map(t=>`<button data-t="${esc(t)}">#${esc(t)}</button>`).join("")}</div>`:"")+
 (p.description?`<p class="pdesc">${esc(p.description)}</p>`:"")+
 `<div class="share"><button id="cp" data-u="${esc(u)}">Copy link</button><a href="https://wa.me/?text=${encodeURIComponent(p.title+" "+u)}" target="_blank" rel="noopener">WhatsApp</a><a href="https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(u)}" target="_blank" rel="noopener">Facebook</a></div><div class="pimgs">${p.images.map(i=>`<img loading="lazy" src="${esc(i)}" alt="${esc(p.title)}">`).join("")}</div>`;
 document.title=p.title+" - "+T0}
function cur(){const m=location.hash.match(/^#p-(.+)$/);return m&&D.find(x=>x.id===decodeURIComponent(m[1]))}
function route(){const p=cur(),pj=$("pj");
 if(p){fill(p);pj.hidden=false;document.body.style.overflow="hidden";pj.scrollTop=0;pj.querySelector(".pc").focus()}
 else if(!pj.hidden){pj.hidden=true;document.body.style.overflow="";document.title=T0;pushed=false}}
function open(id){history.pushState(null,"","#p-"+encodeURIComponent(id));pushed=true;route()}
function close(){if(pushed)history.back();else{history.replaceState(null,"",location.pathname+location.search);route()}}
function step(n){const p=cur();if(!p)return;let l=view.length?view:D,i=l.findIndex(x=>x.id===p.id);if(i<0){l=D;i=l.findIndex(x=>x.id===p.id)}
 history.replaceState(null,"","#p-"+encodeURIComponent(l[(i+n+l.length)%l.length].id));route()}
$("tabs").onclick=e=>{const b=e.target.closest("button");if(b){cat=b.dataset.c;render()}};
$("tags").onclick=e=>{const b=e.target.closest("button");if(b){tag=tag===b.dataset.t?"":b.dataset.t;render()}};
$("grid").onclick=e=>{const c=e.target.closest(".card");if(c)open(c.dataset.id)};
$("grid").onkeydown=e=>{if((e.key==="Enter"||e.key===" ")&&e.target.classList.contains("card")){e.preventDefault();open(e.target.dataset.id)}};
$("pj").onclick=e=>{const t=e.target;
 if(t.closest(".pc"))close();else if(t.closest(".pp"))step(-1);else if(t.closest(".pn"))step(1);
 else if(t.id==="cp")navigator.clipboard.writeText(t.dataset.u).then(()=>t.textContent="Link copied",()=>prompt("Copy this link",t.dataset.u));
 else if(t.closest("[data-t]")){tag=t.closest("[data-t]").dataset.t;cat="All";close();render();setTimeout(()=>$("work").scrollIntoView(),60)}};
document.addEventListener("keydown",e=>{if($("pj").hidden)return;if(e.key==="Escape")close();if(e.key==="ArrowLeft")step(-1);if(e.key==="ArrowRight")step(1)});
addEventListener("popstate",route);
fetch("site.json?v="+Date.now()).then(r=>r.json()).then(d=>{data=d}).catch(()=>{}).finally(()=>{render();route()});
</script></body></html>
