<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Admin - Elite Design</title>
<style>
:root{--ink:#0a0344;--accent:#d93a00;--line:#dcdcee;--muted:#5b5d86}
*{box-sizing:border-box}body{background:#f3f4fa;color:#14123a;font:16px/1.5 system-ui,sans-serif;padding:20px;max-width:960px;margin:auto}
h1{margin:0 0 14px;color:var(--ink)}h2{margin:0 0 12px;font-size:1.1rem;color:var(--ink)}
.box{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:18px}
label{display:block;font-size:.85rem;color:var(--muted);margin:10px 0 4px}
input,textarea{width:100%;padding:10px;border-radius:8px;border:1px solid var(--line);font:inherit;background:#fff}
button{background:var(--accent);color:#fff;border:0;padding:10px 18px;border-radius:8px;font-weight:700;cursor:pointer;margin:12px 8px 0 0}
button.g{background:#e6e7f3;color:var(--ink)}button.del{background:#8b2f2f;margin:0}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:600px){.row{grid-template-columns:1fr}}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;margin-top:12px}
.list div{border:1px solid var(--line);border-radius:8px;padding:8px;font-size:.85rem}.list img{width:100%;height:110px;object-fit:cover;border-radius:6px;margin-bottom:6px;background:#e6e7f3}
.list button{margin:6px 6px 0 0;padding:5px 10px;font-size:.8rem}
#msg{position:sticky;top:8px;padding:10px 14px;border-radius:8px;background:#1f5d3a;color:#fff;display:none;z-index:9}#msg.err{background:#8b2f2f}
small{color:var(--muted)}
</style></head><body>
<h1>Elite Design - Admin</h1><div id="msg"></div>
<div class="box" id="login"><h2>Login</h2><small>This is saved only in your browser.</small>
<div class="row"><div><label>GitHub username</label><input id="u" value="EliteDesign7"></div><div><label>Repository name</label><input id="r" value="EliteDesign7.github.io"></div></div>
<label>GitHub token</label><input id="t" type="password"><button onclick="login()">Login</button></div>
<div id="panel" hidden>
<div class="box"><h2 id="ph">New project</h2><input type="hidden" id="pe">
<div class="row"><div><label>Project title</label><input id="pt"></div><div><label>Category (Logo, Poster, Calligraphy...)</label><input id="pc" list="cl"><datalist id="cl"></datalist></div></div>
<label>Tags, separated by commas (logo, branding, bangla-typography)</label><input id="pg">
<label>Description</label><textarea id="pd" rows="4"></textarea>
<label id="pfl">Images (select many; the first one becomes the cover)</label><input id="pf" type="file" accept="image/*" multiple>
<button id="pb" onclick="publish()">Publish project</button><button class="g" id="px" onclick="resetForm()" hidden>Cancel edit</button></div>
<div class="box"><h2>Projects</h2><div class="list" id="list"></div></div>
<div class="box"><h2>Logo and cover</h2><div class="row"><div><label>Logo (square, PNG is best)</label><input id="lf" type="file" accept="image/*"></div><div><label>Cover banner (wide image)</label><input id="cf" type="file" accept="image/*"></div></div>
<button onclick="setImg()">Save logo / cover</button></div>
<div class="box"><h2>Website info</h2>
<div class="row"><div><label>Name</label><input id="sn"></div><div><label>Tagline</label><input id="st"></div></div>
<label>About me</label><textarea id="sa" rows="4"></textarea>
<div class="row"><div><label>Email</label><input id="se"></div><div><label>WhatsApp number (with country code)</label><input id="sw"></div></div>
<label>Facebook page link</label><input id="sf"><button onclick="saveSettings()">Save</button></div>
<button class="g" onclick="logout()">Logout</button></div>
<script>
const $=id=>document.getElementById(id);
let cfg=JSON.parse(localStorage.getItem("ed_cfg")||"null"),data,working=false;
const e=s=>String(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function msg(t,x){const m=$("msg");m.textContent=t;m.className=x?"err":"";m.style.display="block";if(!x&&!/\.\.\.$/.test(t))setTimeout(()=>m.style.display="none",4000)}
const api=p=>`https://api.github.com/repos/${cfg.u}/${cfg.r}/contents/${p}`;
async function gh(p,method,body){const r=await fetch(api(p),{method,headers:{Authorization:"Bearer "+cfg.t,Accept:"application/vnd.github+json"},body:body&&JSON.stringify(body)});
 if(!r.ok&&!(method==="GET"&&r.status===404))throw new Error((await r.json()).message||r.status);return r.status===404?null:r.json()}
const b64=s=>btoa(unescape(encodeURIComponent(s)));
async function loadData(){const f=await gh("site.json","GET");if(!f){data={settings:{},designs:[],sha:null};return}
 data=JSON.parse(decodeURIComponent(escape(atob(f.content.replace(/\n/g,"")))));data.sha=f.sha;data.designs=data.designs||[];data.settings=data.settings||{}}
async function saveData(m){const{sha,...d}=data;const r=await gh("site.json","PUT",{message:m,content:b64(JSON.stringify(d,null,1)),...(sha?{sha}:{})});data.sha=r.content.sha}
async function putFile(p,content,m){const x=await gh(p,"GET");await gh(p,"PUT",{message:m,content,...(x&&x.sha?{sha:x.sha}:{})})}
function shrink(f,max,type="image/jpeg"){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>{const k=Math.min(1,max/Math.max(i.width,i.height)),c=document.createElement("canvas");c.width=Math.round(i.width*k);c.height=Math.round(i.height*k);const x=c.getContext("2d");
 if(type==="image/jpeg"){x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height)}x.drawImage(i,0,0,c.width,c.height);res(c.toDataURL(type,.9).split(",")[1])};i.onerror=rej;i.src=URL.createObjectURL(f)})}
function sharePage(p){const b=`https://${cfg.r}`,u=`${b}/projects/${p.id}/`,d=e((p.description||data.settings.tagline||"").replace(/\s+/g," ").slice(0,200));
 return `<!DOCTYPE html><html><head><meta charset="utf-8"><title>${e(p.title)}</title><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="${d}"><meta name="keywords" content="${e((p.tags||[]).join(", "))}"><meta property="og:type" content="article"><meta property="og:site_name" content="${e(data.settings.name)}"><meta property="og:title" content="${e(p.title)}"><meta property="og:description" content="${d}"><meta property="og:image" content="${b}/${e(p.cover)}"><meta property="og:url" content="${u}"><meta name="twitter:card" content="summary_large_image"><script>location.replace("/#p-${p.id}")<\/script></head><body><a href="/#p-${p.id}">${e(p.title)}</a></body></html>`}
async function login(){cfg={u:$("u").value.trim(),r:$("r").value.trim(),t:$("t").value.trim()};try{await loadData();localStorage.setItem("ed_cfg",JSON.stringify(cfg));show()}catch(x){msg("Login failed: "+x.message,1)}}
function logout(){localStorage.removeItem("ed_cfg");location.reload()}
function show(){$("login").hidden=true;$("panel").hidden=false;const s=data.settings;
 $("sn").value=s.name||"";$("st").value=s.tagline||"";$("sa").value=s.about||"";$("se").value=s.email||"";$("sw").value=s.whatsapp||"";$("sf").value=s.facebook||"";draw()}
function draw(){const D=data.designs;$("cl").innerHTML=[...new Set(D.map(d=>d.category).filter(Boolean))].map(c=>`<option value="${e(c)}">`).join("");
 $("list").innerHTML=D.map(d=>`<div><img src="https://raw.githubusercontent.com/${cfg.u}/${cfg.r}/main/${d.cover}" alt=""><b>${e(d.title)}</b><br><small>${e(d.category)} · ${(d.images||[]).length} images</small><br><small>${e((d.tags||[]).map(t=>"#"+t).join(" "))}</small><br><button class="g" onclick="editP('${d.id}')">Edit</button><button class="del" onclick="delP('${d.id}')">Delete</button></div>`).join("")||"<small>No projects yet.</small>"}
function resetForm(){["pe","pt","pc","pg","pd","pf"].forEach(i=>$(i).value="");$("ph").textContent="New project";$("pb").textContent="Publish project";$("px").hidden=true;$("pfl").textContent="Images (select many; the first one becomes the cover)"}
function editP(id){const p=data.designs.find(d=>d.id===id);$("pe").value=id;$("pt").value=p.title;$("pc").value=p.category||"";$("pg").value=(p.tags||[]).join(", ");$("pd").value=p.description||"";
 $("ph").textContent="Edit project";$("pb").textContent="Save changes";$("px").hidden=false;$("pfl").textContent="Add more images (optional)";scrollTo(0,0)}
async function publish(){if(working)return;const t=$("pt").value.trim(),fs=[...$("pf").files],eid=$("pe").value;
 if(!t)return msg("Add a project title first",1);if(!eid&&!fs.length)return msg("Select at least one image",1);
 working=true;try{
  const p=eid?data.designs.find(d=>d.id===eid):{id:"p"+Date.now().toString(36),images:[],cover:"",date:new Date().toISOString().slice(0,10)};
  Object.assign(p,{title:t,category:$("pc").value.trim(),description:$("pd").value.trim(),tags:[...new Set($("pg").value.split(",").map(s=>s.trim().replace(/^#+/,"").replace(/\s+/g,"-").toLowerCase()).filter(Boolean))]});
  const dir=`projects/${p.id}`;let n=0;
  for(const f of fs){n++;msg(`Uploading image ${n} of ${fs.length}...`);const name=`${dir}/img-${Date.now()}-${n}.jpg`;
   await gh(name,"PUT",{message:"Add image",content:await shrink(f,2000)});p.images.push(name);
   if(!p.cover){p.cover=`${dir}/cover-${Date.now()}.jpg`;await gh(p.cover,"PUT",{message:"Add cover",content:await shrink(f,800)})}}
  msg("Saving...");await putFile(`${dir}/index.html`,b64(sharePage(p)),"Share page");
  if(!eid)data.designs.unshift(p);await saveData("Save project");resetForm();draw();msg("Done. It will be live in 1-2 minutes.")
 }catch(x){msg(x.message,1)}working=false}
async function delP(id){if(working||!confirm("Delete this project and all its images?"))return;working=true;
 try{msg("Deleting...");const fl=await gh("projects/"+id,"GET");for(const f of fl||[])await gh(f.path,"DELETE",{message:"Delete file",sha:f.sha});
  data.designs=data.designs.filter(d=>d.id!==id);await saveData("Delete project");draw();msg("Deleted")}catch(x){msg(x.message,1)}working=false}
async function setImg(){const lf=$("lf").files[0],cf=$("cf").files[0];if(!lf&&!cf)return msg("Select a logo or a cover first",1);
 try{msg("Saving...");if(lf){const p=`images/logo-${Date.now()}.png`;await gh(p,"PUT",{message:"Logo",content:await shrink(lf,800,"image/png")});data.settings.logo=p}
  if(cf){const p=`images/cover-${Date.now()}.jpg`;await gh(p,"PUT",{message:"Cover",content:await shrink(cf,2400)});data.settings.cover=p}
  await saveData("Update logo/cover");$("lf").value=$("cf").value="";msg("Saved. It will be live in 1-2 minutes.")}catch(x){msg(x.message,1)}}
async function saveSettings(){try{Object.assign(data.settings,{name:$("sn").value,tagline:$("st").value,about:$("sa").value,email:$("se").value,whatsapp:$("sw").value,facebook:$("sf").value});await saveData("Update settings");msg("Saved")}catch(x){msg(x.message,1)}}
if(cfg)loadData().then(show).catch(()=>{});
</script></body></html>
